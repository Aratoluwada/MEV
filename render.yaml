services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: mev-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard environment
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMINI_VISION_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        value: sqlite:///./data/registry.db

  # 2. React Vite Frontend Static Site
  - type: web
    name: mev-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mev-backend
          property: host
